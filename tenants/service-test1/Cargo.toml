[package]
name = "service-test1"
version = "0.1.0"
edition = "2024"

[dependencies]
wstd = "0.6.8"

[profile.release]
opt-level = "s"     # tối ưu kích thước file
lto = true          # gộp và tối ưu xuyên crate, file nhỏ hơn
strip = true        # bỏ thông tin debug
codegen-units = 1   # tối ưu tốt hơn, build chậm hơn một chút
panic = "abort"     # bỏ code xử lý unwind, file nhỏ hơn