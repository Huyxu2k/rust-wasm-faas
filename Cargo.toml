[workspace]
members = [
    "gateway",
    "tenants/sample1"
]
resolver = "2"

[workspace.package]
name = "rust-wasm-faas"
version = "0.1.0"
edition = "2024"
authors = ["nguyenhuy2712000@gmail.com"]

[workspace.dependencies]
tokio = { version = "1.54.1", features = ["full"] }
axum = "0.8.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

dotenvy = "0.15.7"

wasmtime = "50.0.1"
wasmtime-wasi = "50.0.1"

rusqlite = { version = "0.41.1", features = ["bundled"] }
uuid = { version = "1.29.2", features = ["v4"]}

thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json","env-filter"] }

prometheus = "0.14.0"