[workspace]
members = [
    "gateway",
    "tenants/service-test1"
    ]
resolver = "2"

[workspace.package]
name = "rust-wasm-faas"
version = "0.1.0"
edition = "2024"
authors = ["nguyenhuy2712000@gmail.com"]

[workspace.dependencies]
tokio = { version = "1.54.1", features = ["full"] }
axum = {version = "0.8.9", features = ["multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
moka = { version = "0.12.16", features = ["future"] }
http-body-util = "0.1.5"

dotenvy = "0.15.7"

wasmtime = "50.0.1"
wasmtime-wasi = "50.0.1"
wasmtime-wasi-http = "50.0.1"
bytes = "1.12.1"

rusqlite = { version = "0.41.1", features = ["bundled"] }
uuid = { version = "1.29.2", features = ["v4", "serde"]}

thiserror = "2"
anyhow = "1.0.104"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json","env-filter"] }

prometheus = "0.14.0"
